resource:
    name: ShipmentTypes
    shortName: shipment-types
    description: Shipment types listing API for Storefront operations

    provider: Spryker\Glue\ShipmentTypesRestApi\Api\Storefront\Provider\ShipmentTypesStorefrontProvider

    paginationEnabled: false

    operations:
        - type: Get
          openapiContext:
              responses:
                  200:
                      description: 'Shipment type returned.'
                  404:
                      description: 'Shipment type not found.'
        - type: GetCollection
          openapiContext:
              responses:
                  200:
                      description: 'Shipment types collection returned.'
                  400:
                      description: 'Invalid sort parameter.'

    includes:
        - relationshipName: service-types
          targetResource: ServiceTypes
          uriTemplate: /service-types/{uuid}
          uriVariableMappings:
              serviceTypeUuid: uuid

    properties:
        uuid:
            type: string
            identifier: true
            readable: false
            writable: false
            description: 'Shipment type UUID.'
            openapiContext:
                example: '0e6d2c2e-6b3c-5e9f-9b2c-9b2c9b2c9b2c'

        name:
            type: string
            readable: true
            writable: false
            description: 'Shipment type name.'
            openapiContext:
                example: 'Express'

        key:
            type: string
            readable: true
            writable: false
            description: 'Shipment type key.'
            openapiContext:
                example: 'express'

        serviceTypeUuid:
            type: string
            readable: false
            writable: false
            description: 'Service type UUID for relationship resolution.'
